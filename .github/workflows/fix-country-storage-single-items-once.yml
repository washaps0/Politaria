name: Fix country storage single-item clicks once

on:
  push:
    paths:
      - '.github/workflows/fix-country-storage-single-items-once.yml'
      - '.github/scripts/fix_country_storage_single_items.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply storage click fix
        run: python .github/scripts/fix_country_storage_single_items.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/plugins/Skript/scripts/countries_storage.sk
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Allow single-item country storage clicks"
          git push
