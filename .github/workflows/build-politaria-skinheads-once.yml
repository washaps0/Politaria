name: Build PolitariaSkinHeads once

on:
  push:
    paths:
      - 'server/pluginsource/PolitariaSkinHeads/**'
      - '.github/workflows/build-politaria-skinheads-once.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build PolitariaSkinHeads
        run: gradle -p server/pluginsource/PolitariaSkinHeads clean build --no-daemon

      - name: Copy plugin jar
        run: cp server/pluginsource/PolitariaSkinHeads/build/libs/PolitariaSkinHeads.jar server/plugins/PolitariaSkinHeads.jar

      - name: Commit built jar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/plugins/PolitariaSkinHeads.jar
          git commit -m "Build PolitariaSkinHeads plugin"
          git push
