name: Fix country storage hub clicks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-storage-hub-click.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch countries storage menu bypass
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('server/plugins/Skript/scripts/countries.sk')
          text = path.read_text(encoding='utf-8')
          old = '''\t# Storage categories intentionally behave like a normal Minecraft chest.\n\t# countries_storage.sk handles only its control row and permissions.\n\tif {_country-menu-state} is "storage-category":\n\t\tstop\n\tcancel event\n'''
          new = '''\t# Country storage has its own click handling in countries_storage.sk.\n\t# Do not cancel either the storage hub or the real chest-like category view here.\n\tif {_country-menu-state} is "storage-hub":\n\t\tstop\n\tif {_country-menu-state} is "storage-category":\n\t\tstop\n\tcancel event\n'''
          if old not in text:
              raise SystemExit('Expected storage bypass block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fix
        shell: bash
        run: |
          git rm .github/workflows/fix-storage-hub-click.yml
          git config user.name "Politaria Bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/plugins/Skript/scripts/countries.sk
          git commit -m "Allow country storage hub category clicks"
          git pull --rebase origin main
          git push origin main
