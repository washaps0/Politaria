name: Port plugins to Minecraft 1.21.11

on:
  push:
    branches: [serverport]
    paths: ['.github/workflows/port-plugins-1.21.11.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-plugins:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[plugin-port]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: serverport
          fetch-depth: 0

      - name: Download verified 1.21.11 builds
        shell: bash
        run: |
          set -euo pipefail
          P=server/plugins
          mkdir -p "$P"

          dl() {
            echo "Downloading $2"
            curl -g -fL --retry 4 --retry-delay 2 -A 'Politaria-Plugin-Port/1.5' "$1" -o "$2"
          }

          gh_asset() {
            repo="$1"; regex="$2"; dest="$3"
            url=$(curl -g -fsSL -A 'Politaria-Plugin-Port/1.5' "https://api.github.com/repos/$repo/releases/latest" \
              | jq -r --arg re "$regex" '.assets[] | select(.name | test($re; "i")) | .browser_download_url' \
              | head -n1)
            test -n "$url" && test "$url" != null || { echo "No asset: $repo / $regex"; exit 1; }
            dl "$url" "$dest"
          }

          modrinth_required() {
            project="$1"; dest="$2"
            json=$(curl -g -fsSL -A 'Politaria-Plugin-Port/1.5' "https://api.modrinth.com/v2/project/$project/version?game_versions=%5B%221.21.11%22%5D")
            url=$(printf '%s' "$json" | jq -r '[.[] | select(.version_type=="release") | select(any(.loaders[]; .=="bukkit" or .=="paper" or .=="purpur" or .=="spigot"))][0].files | ((map(select(.primary==true)) + .)[0].url) // empty')
            test -n "$url" || { echo "No stable 1.21.11 Modrinth release: $project"; exit 1; }
            dl "$url" "$dest"
          }

          modrinth_optional() {
            project="$1"; dest="$2"
            json=$(curl -g -fsSL -A 'Politaria-Plugin-Port/1.5' "https://api.modrinth.com/v2/project/$project/version?game_versions=%5B%221.21.11%22%5D" || true)
            url=$(printf '%s' "$json" | jq -r '[.[] | select(.version_type=="release") | select(any(.loaders[]; .=="bukkit" or .=="paper" or .=="purpur" or .=="spigot"))][0].files | ((map(select(.primary==true)) + .)[0].url) // empty' 2>/dev/null || true)
            if [[ -n "$url" ]]; then
              dl "$url" "$dest"
            else
              echo "No optional 1.21.11 build for $project; keeping current jar"
            fi
          }

          # Keep BlueMap 5.16: this is the tested build that loads on Purpur 1.21.11
          # and is compatible with PolitariaMapBridge. Do not replace it with BlueMap 5.24,
          # which requires the newer 26.1.1 Bukkit API.

          # WorldEdit was intentionally removed from this server. Do not re-add it here.

          rm -f "$P"/Citizens-*.jar "$P"/Citizens.jar
          rm -f "$P"/ProtocolLib*.jar
          rm -f "$P"/TAB.jar "$P"/TAB.v*.jar
          rm -f "$P"/voicechat-bukkit-*.jar "$P"/voicechat-bukkit.jar
          rm -f "$P"/SkinsRestorer*.jar
          rm -f "$P"/ViaVersion-*.jar "$P"/ViaVersion.jar
          rm -f "$P"/ViaBackwards-*.jar "$P"/ViaBackwards.jar
          rm -f "$P"/Skript-*.jar "$P"/Skript.jar
          rm -f "$P"/skript-reflect-*.jar "$P"/skript-reflect.jar

          # ProtocolLib official dev build contains explicit 1.21.11 support.
          dl 'https://github.com/dmulloy2/ProtocolLib/releases/download/dev-build/ProtocolLib.jar' "$P/ProtocolLib.jar"

          # Current TAB universal build includes a Paper 1.21.11 implementation.
          gh_asset NEZNAMY/TAB '^TAB[.]v[0-9.]+[.]jar$' "$P/TAB.jar"

          # Citizens distribution with the current 1.21.11 adapter.
          citizens_dir='https://ci.citizensnpcs.co/job/Citizens2/lastSuccessfulBuild/artifact/dist/target/'
          cfile=$(curl -g -fsSL -A 'Politaria-Plugin-Port/1.5' "$citizens_dir" \
            | grep -oE 'Citizens-[0-9.]+-b[0-9]+[.]jar' \
            | head -n1)
          test -n "$cfile" || { echo 'Citizens distribution artifact not found'; exit 1; }
          dl "${citizens_dir}${cfile}" "$P/Citizens.jar"

          modrinth_required simple-voice-chat "$P/voicechat-bukkit.jar"
          modrinth_required skinsrestorer "$P/SkinsRestorer.jar"

          gh_asset ViaVersion/ViaVersion '^ViaVersion-[0-9.]+[.]jar$' "$P/ViaVersion.jar"
          gh_asset ViaVersion/ViaBackwards '^ViaBackwards-[0-9.]+[.]jar$' "$P/ViaBackwards.jar"
          gh_asset SkriptLang/Skript '^Skript-[0-9.]+[.]jar$' "$P/Skript.jar"
          gh_asset SkriptLang/skript-reflect '^skript-reflect-[0-9.]+[.]jar$' "$P/skript-reflect.jar"

          # Upgrade Grim when Modrinth exposes a newer stable build for exactly 1.21.11.
          rm -f "$P/GrimAC-new.jar"
          modrinth_optional grimac "$P/GrimAC-new.jar"
          if [[ -s "$P/GrimAC-new.jar" ]]; then
            rm -f "$P"/grimac-bukkit-*.jar "$P"/GrimAC.jar
            mv "$P/GrimAC-new.jar" "$P/GrimAC.jar"
          fi

          echo "Validating downloaded jars..."
          jars=(
            "$P/ProtocolLib.jar"
            "$P/TAB.jar"
            "$P/Citizens.jar"
            "$P/voicechat-bukkit.jar"
            "$P/SkinsRestorer.jar"
            "$P/ViaVersion.jar"
            "$P/ViaBackwards.jar"
            "$P/Skript.jar"
            "$P/skript-reflect.jar"
          )
          if [[ -f "$P/GrimAC.jar" ]]; then jars+=("$P/GrimAC.jar"); fi
          for jar in "${jars[@]}"; do
            test -s "$jar"
            unzip -tqq "$jar"
          done

      - name: Fix duplicate Politaria tag permission metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          jar = Path('server/plugins/PolitariaTags.jar')
          if not jar.exists():
              raise SystemExit('PolitariaTags.jar not found')

          with zipfile.ZipFile(jar, 'r') as zin:
              entries = [(info, zin.read(info.filename)) for info in zin.infolist()]

          patched = False
          rewritten = []
          for info, data in entries:
              if info.filename == 'plugin.yml':
                  text = data.decode('utf-8')
                  block = '\npermissions:\n  politaria.tags.manage:\n    default: op\n'
                  if block in text:
                      text = text.replace(block, '\n')
                      patched = True
                  data = text.encode('utf-8')
              rewritten.append((info, data))

          if patched:
              tmp = jar.with_suffix('.jar.tmp')
              with zipfile.ZipFile(tmp, 'w') as zout:
                  for info, data in rewritten:
                      zout.writestr(info, data)
              tmp.replace(jar)
              print('Removed duplicate politaria.tags.manage declaration from PolitariaTags.jar')
          else:
              print('PolitariaTags.jar already has no duplicate permission declaration')
          PY
          unzip -tqq server/plugins/PolitariaTags.jar

      - name: Patch Skript compatibility issues found in 1.21.11 boot log
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/plugins/Skript/scripts/justice.sk')
          text = p.read_text(encoding='utf-8')
          replacements = {
              'chain named "<aqua><bold>%name of {_target}%"': 'iron bars named "<aqua><bold>%name of {_target}%"',
              'chain named "<aqua><bold>НАРУЧНИКИ"': 'iron bars named "<aqua><bold>НАРУЧНИКИ"',
              'chain named "<aqua><bold>ЗАДЕРЖАТЬ"': 'iron bars named "<aqua><bold>ЗАДЕРЖАТЬ"',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Write migration notes
        shell: bash
        run: |
          cat > server/PLUGIN_PORT_1.21.11.md <<'EOF'
          # Minecraft 1.21.11 migration

          Tested server runtime: Purpur 1.21.11 on Java 21.

          Updated/verified:
          - Citizens
          - ProtocolLib
          - TAB
          - Simple Voice Chat
          - SkinsRestorer
          - ViaVersion
          - ViaBackwards
          - Skript
          - skript-reflect
          - GrimAC when a newer stable 1.21.11 build is available

          Intentionally pinned/retained:
          - BlueMap 5.16, because it loads on 1.21.11 and remains API-compatible with PolitariaMapBridge
          - CoreProtect 24.0
          - Orebfuscator 5.6.1
          - FastLeafDecay 2.0.1
          - ProAntiTab 2.4.3
          - AutoBackup 1.1
          - DisableJoinMessage 1.1

          Removed / not managed by this workflow:
          - WorldEdit

          Compatibility fixes:
          - `justice.sk`: old `chain` GUI item alias replaced with `iron bars`
          - TAB configuration migrated to config-version 7
          - obsolete TAB example-group header/footer removed
          - LuckPerms-only TAB placeholders removed because Politaria does not use LuckPerms
          - duplicate `politaria.tags.manage` permission declaration removed from PolitariaTags metadata; PolitariaIdentity remains the owner of that permission

          Expected warnings that are intentional configuration choices, not startup failures:
          - offline-mode / voice-chat encryption warning: Politaria uses its own authentication flow
          - GrimAC + ViaBackwards vehicle warning: applies to old translated clients using vehicles
          - ProAntiTab missing permissions-plugin warning: its global filtering still works, while permission-group features are unused
          EOF

      - name: Commit plugin port and compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/plugins server/PLUGIN_PORT_1.21.11.md
          git add server/plugins/Skript/scripts/justice.sk
          git diff --cached --quiet && exit 0
          git commit -m '[plugin-port] Clean remaining 1.21.11 compatibility warnings'
          git push origin HEAD:serverport
