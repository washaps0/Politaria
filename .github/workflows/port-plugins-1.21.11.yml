name: Port plugins to Minecraft 1.21.11

on:
  push:
    branches: [serverport]
    paths: ['.github/workflows/port-plugins-1.21.11.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-plugins:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[plugin-port]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: serverport
          fetch-depth: 0

      - name: Download verified 1.21.11 builds
        shell: bash
        run: |
          set -euo pipefail
          P=server/plugins
          mkdir -p "$P"

          dl() { echo "Downloading $2"; curl -g -fL --retry 4 --retry-delay 2 -A 'Politaria-Plugin-Port/1.2' "$1" -o "$2"; }

          gh_asset() {
            repo="$1"; regex="$2"; dest="$3"
            url=$(curl -g -fsSL -A 'Politaria-Plugin-Port/1.2' "https://api.github.com/repos/$repo/releases/latest" | jq -r --arg re "$regex" '.assets[] | select(.name | test($re; "i")) | .browser_download_url' | head -n1)
            test -n "$url" && test "$url" != null || { echo "No asset: $repo / $regex"; exit 1; }
            dl "$url" "$dest"
          }

          modrinth() {
            project="$1"; dest="$2"
            json=$(curl -g -fsSL -A 'Politaria-Plugin-Port/1.2' "https://api.modrinth.com/v2/project/$project/version?game_versions=%5B%221.21.11%22%5D")
            url=$(printf '%s' "$json" | jq -r '[.[] | select(.version_type=="release") | select(any(.loaders[]; .=="bukkit" or .=="paper" or .=="purpur" or .=="spigot"))][0].files | ((map(select(.primary==true)) + .)[0].url) // empty')
            test -n "$url" || { echo "No 1.21.11 Modrinth release: $project"; exit 1; }
            dl "$url" "$dest"
          }

          rm -f "$P"/Citizens-*.jar "$P"/Citizens.jar
          rm -f "$P"/bluemap-*-spigot.jar "$P"/bluemap-*-paper.jar "$P"/BlueMap.jar
          rm -f "$P"/ProtocolLib*.jar "$P"/TAB.jar "$P"/TAB.v*.jar
          rm -f "$P"/worldedit-bukkit-*.jar "$P"/WorldEdit.jar
          rm -f "$P"/voicechat-bukkit-*.jar "$P"/voicechat-bukkit.jar
          rm -f "$P"/SkinsRestorer*.jar
          rm -f "$P"/ViaVersion*.jar "$P"/ViaBackwards*.jar
          rm -f "$P"/Skript-*.jar "$P"/Skript.jar "$P"/skript-reflect*.jar

          gh_asset BlueMap-Minecraft/BlueMap 'bluemap-[0-9.]+-paper[.]jar$' "$P/BlueMap.jar"
          dl 'https://github.com/dmulloy2/ProtocolLib/releases/download/dev-build/ProtocolLib.jar' "$P/ProtocolLib.jar"
          gh_asset NEZNAMY/TAB '^TAB[.]v[0-9.]+[.]jar$' "$P/TAB.jar"

          cjson=$(curl -g -fsSL -A 'Politaria-Plugin-Port/1.2' 'https://ci.citizensnpcs.co/job/Citizens2/lastSuccessfulBuild/api/json?tree=artifacts[fileName,relativePath]')
          crel=$(printf '%s' "$cjson" | jq -r '.artifacts[] | select(.fileName | test("^Citizens.*[.]jar$";"i")) | .relativePath' | head -n1)
          test -n "$crel" || { echo 'Citizens artifact not found'; exit 1; }
          dl "https://ci.citizensnpcs.co/job/Citizens2/lastSuccessfulBuild/artifact/$crel" "$P/Citizens.jar"

          modrinth worldedit "$P/WorldEdit.jar"
          modrinth simple-voice-chat "$P/voicechat-bukkit.jar"
          modrinth skinsrestorer "$P/SkinsRestorer.jar"

          gh_asset ViaVersion/ViaVersion '^ViaVersion-[0-9.]+[.]jar$' "$P/ViaVersion.jar"
          gh_asset ViaVersion/ViaBackwards '^ViaBackwards-[0-9.]+[.]jar$' "$P/ViaBackwards.jar"
          gh_asset SkriptLang/Skript '^Skript(-[0-9.]+)?[.]jar$' "$P/Skript.jar"
          gh_asset SkriptLang/skript-reflect '^skript-reflect(-[0-9.]+)?[.]jar$' "$P/skript-reflect.jar"

          for f in BlueMap ProtocolLib TAB Citizens WorldEdit SkinsRestorer ViaVersion ViaBackwards Skript skript-reflect; do unzip -tqq "$P/$f.jar"; done
          unzip -tqq "$P/voicechat-bukkit.jar"

          cat > server/PLUGIN_PORT_1.21.11.md <<'EOF'
          # Minecraft 1.21.11 plugin port

          Updated from verified upstream sources: BlueMap, Citizens, ProtocolLib, TAB, WorldEdit, Simple Voice Chat, SkinsRestorer, ViaVersion, ViaBackwards, Skript and skript-reflect.

          ProtocolLib uses the official maintained dev-build because it explicitly added Minecraft 1.21.11 support while the old stable build predates it.

          Existing builds retained pending separate compatibility verification: AutoBackup, CoreProtect, DisableJoinMessage, FastLeafDecay, GrimAC, Orebfuscator and ProAntiTab.

          Custom Politaria plugins were not blindly replaced: PolitariaApartments, PolitariaIdentity, PolitariaMapBridge, PolitariaSpawnProtection and PolitariaTags need API/runtime testing or recompilation for 1.21.11.
          EOF

      - name: Commit plugin port
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/plugins server/PLUGIN_PORT_1.21.11.md
          git diff --cached --quiet && exit 0
          git commit -m '[plugin-port] Update verified plugins for Minecraft 1.21.11'
          git push origin HEAD:serverport
