name: Add category ClientSort sorting

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-storage-category-client-sort.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch category sorting
        shell: bash
        run: |
          echo ' ' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit changes
        shell: bash
        run: |
          git rm .github/workflows/add-storage-category-client-sort.yml
          git config user.name "Politaria Bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/plugins/Skript/scripts/countries_storage.sk
          git commit -m "Add ClientSort-style category sorting"
          git pull --rebase origin main
          git push origin main
