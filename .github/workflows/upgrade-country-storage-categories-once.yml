name: Upgrade country storage categories once

on:
  push:
    paths:
      - '.github/workflows/upgrade-country-storage-categories-once.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply storage category patch
        run: python .github/scripts/upgrade_country_storage_categories.py

      - name: Commit storage category upgrade
        run: |
          git config user.name "washaps0"
          git config user.email "washaspo@gmail.com"
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git add server/plugins/Skript/scripts/countries_storage.sk
          git commit -m "Add country storage categories and quick sorting"
          git push
