name: Merge country storage native handling

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/merge-country-storage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge native storage handling into countries_storage.sk
        shell: python
        run: |
          from pathlib import Path

          target = Path('server/plugins/Skript/scripts/countries_storage.sk')
          native = Path('server/plugins/Skript/scripts/00_country_storage_native.sk')

          text = target.read_text(encoding='utf-8')
          native_text = native.read_text(encoding='utf-8')

          old = '''\tif {_state} is "storage-category":
\t\tcancel event
\t\tset {_id} to countryId(player)
'''
          new = '''\tif {_state} is "storage-category":
\t\t# Item slots use normal Minecraft inventory behaviour. The native
\t\t# handler below synchronizes the resulting contents automatically.
\t\tif {_raw} is not between 45 and 53:
\t\t\tstop
\t\tcancel event
\t\tset {_id} to countryId(player)
'''
          if old not in text:
              raise SystemExit('storage-category click block was not found')
          text = text.replace(old, new, 1)

          old_drag = '''on inventory drag:
\tset {_state} to {country.menu::%uuid of player%}
\tif {_state} is "storage-hub":
\t\tcancel event
\tif {_state} is "storage-category":
\t\tcancel event
'''
          new_drag = '''on inventory drag:
\tset {_state} to {country.menu::%uuid of player%}
\tif {_state} is "storage-hub":
\t\tcancel event
'''
          if old_drag not in text:
              raise SystemExit('storage drag block was not found')
          text = text.replace(old_drag, new_drag, 1)

          # The helper/event code now lives in this same script instead of
          # being loaded as a separate Skript file.
          header = '# =========================================================\n# NATIVE STORAGE MOVEMENT (integrated)\n# =========================================================\n'
          body_start = native_text.find('function cstorageNativeCountryId')
          if body_start < 0:
              raise SystemExit('native storage helper functions were not found')
          integrated = native_text[body_start:]

          text = text.rstrip() + '\n\n\n' + header + integrated.rstrip() + '\n'
          target.write_text(text, encoding='utf-8')
          native.unlink()

      - name: Commit merged storage script
        run: |
          git config user.name "Politaria Bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/plugins/Skript/scripts/countries_storage.sk server/plugins/Skript/scripts/00_country_storage_native.sk
          git commit -m "Integrate native storage movement into countries_storage" || exit 0
          git push origin main
