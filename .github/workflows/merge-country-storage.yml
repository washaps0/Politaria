name: Merge country storage native handling

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/merge-country-storage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge native storage handling into countries_storage.sk
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path('server/plugins/Skript/scripts/countries_storage.sk')
          native = Path('server/plugins/Skript/scripts/00_country_storage_native.sk')

          text = target.read_text(encoding='utf-8')
          native_text = native.read_text(encoding='utf-8')

          old = '\tif {_state} is "storage-category":\n\t\tcancel event\n\t\tset {_id} to countryId(player)\n'
          new = '\tif {_state} is "storage-category":\n\t\t# Item slots use normal Minecraft inventory behaviour. The native\n\t\t# handler below synchronizes the resulting contents automatically.\n\t\tif {_raw} is not between 45 and 53:\n\t\t\tstop\n\t\tcancel event\n\t\tset {_id} to countryId(player)\n'
          if old not in text:
              raise SystemExit('storage-category click block was not found')
          text = text.replace(old, new, 1)

          old_drag = 'on inventory drag:\n\tset {_state} to {country.menu::%uuid of player%}\n\tif {_state} is "storage-hub":\n\t\tcancel event\n\tif {_state} is "storage-category":\n\t\tcancel event\n'
          new_drag = 'on inventory drag:\n\tset {_state} to {country.menu::%uuid of player%}\n\tif {_state} is "storage-hub":\n\t\tcancel event\n'
          if old_drag not in text:
              raise SystemExit('storage drag block was not found')
          text = text.replace(old_drag, new_drag, 1)

          header = '# =========================================================\n# NATIVE STORAGE MOVEMENT (integrated)\n# =========================================================\n'
          body_start = native_text.find('function cstorageNativeCountryId')
          if body_start < 0:
              raise SystemExit('native storage helper functions were not found')
          integrated = native_text[body_start:]

          text = text.rstrip() + '\n\n\n' + header + integrated.rstrip() + '\n'
          target.write_text(text, encoding='utf-8')
          native.unlink()
          PY

      - name: Commit merged storage script
        shell: bash
        run: |
          git config user.name "Politaria Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A server/plugins/Skript/scripts
          git commit -m "Integrate native storage movement into countries_storage" || exit 0
          git push origin main
