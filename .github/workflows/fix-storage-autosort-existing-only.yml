name: Fix storage autosort existing only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-storage-autosort-existing-only.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch autosort
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server/plugins/Skript/scripts/countries_storage.sk')
          s = p.read_text(encoding='utf-8')
          old = '''\t\t\t\tif {_target} is "":
\t\t\t\t\tset {_target} to "general"
\t\t\t\tset {_before} to amount of {_item}
\t\t\t\tset {_moved} to countryStorageInsertAmount({_id}, {_target}, {_item})
\t\t\t\tif {_moved} is greater than 0:
\t\t\t\t\tadd {_moved} to {_movedTotal}
\t\t\t\t\tset {_left} to {_before} - {_moved}
\t\t\t\t\tif {_left} is less than or equal to 0:
\t\t\t\t\t\tset slot {_slot} of {_p}'s inventory to air
\t\t\t\t\telse:
\t\t\t\t\t\tset amount of {_item} to {_left}
\t\t\t\t\t\tset slot {_slot} of {_p}'s inventory to {_item}
'''
          new = '''\t\t\t\tif {_target} is not "":
\t\t\t\t\tset {_before} to amount of {_item}
\t\t\t\t\tset {_moved} to countryStorageInsertAmount({_id}, {_target}, {_item})
\t\t\t\t\tif {_moved} is greater than 0:
\t\t\t\t\t\tadd {_moved} to {_movedTotal}
\t\t\t\t\t\tset {_left} to {_before} - {_moved}
\t\t\t\t\t\tif {_left} is less than or equal to 0:
\t\t\t\t\t\t\tset slot {_slot} of {_p}'s inventory to air
\t\t\t\t\t\telse:
\t\t\t\t\t\t\tset amount of {_item} to {_left}
\t\t\t\t\t\t\tset slot {_slot} of {_p}'s inventory to {_item}
'''
          if old not in s:
              raise SystemExit('autosort target block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git rm .github/workflows/fix-storage-autosort-existing-only.yml
          git config user.name "Politaria Bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/plugins/Skript/scripts/countries_storage.sk
          git commit -m "Sort only existing storage item types"
          git pull --rebase origin main
          git push origin main
