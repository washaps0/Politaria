name: Harden storage V5 category id

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-storage-v5-category-id.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix category id construction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server/plugins/Skript/scripts/countries_storage.sk')
          s = p.read_text(encoding='utf-8')
          old = '\t\tadd 1 to {country.storage-category-seq::%{_id}%}\n\t\tset {_cat} to "c%{country.storage-category-seq::%{_id}%}%"'
          new = '\t\tadd 1 to {country.storage-category-seq::%{_id}%}\n\t\tset {_seq} to {country.storage-category-seq::%{_id}%}\n\t\tset {_cat} to "c%{_seq}%"'
          if old not in s:
              raise SystemExit('target category id code not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git rm .github/workflows/fix-storage-v5-category-id.yml
          git config user.name "Politaria Bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/plugins/Skript/scripts/countries_storage.sk
          git commit -m "Harden country storage V5 category ids"
          git pull --rebase origin main
          git push origin main
