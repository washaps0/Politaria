name: Add storage category icons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-storage-category-icons.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch category icons
        shell: bash
        run: >-
          python -c "from pathlib import Path; p=Path('server/plugins/Skript/scripts/countries_storage.sk'); s=p.read_text(encoding='utf-8'); old='\t\tset {_catUsed} to countryStorageCategorySlots({_id}, {_cat})\n\t\tset slot {_menuSlot} of {_menu} to barrel named \"<yellow><bold>%loop-value%\" with lore \"<gray>Занято: <white>%{_catUsed}% стаков\" and \"\" and \"<yellow>Нажмите, чтобы открыть\"\n\t\tset {country.storage5-menu-category::%uuid of {_p}%::%{_menuSlot}%} to {_cat}'; new='\t\tset {_catUsed} to countryStorageCategorySlots({_id}, {_cat})\n\t\tset {_icon} to {country.storage-category-icon::%{_id}%::%{_cat}%}\n\t\tif {_icon} is not set:\n\t\t\tset {_icon} to barrel\n\t\tset {_displayIcon} to {_icon}\n\t\tset amount of {_displayIcon} to 1\n\t\tset name of {_displayIcon} to \"<yellow><bold>%loop-value%\"\n\t\tset lore of {_displayIcon} to \"<gray>Занято: <white>%{_catUsed}% стаков\" and \"\" and \"<yellow>Нажмите, чтобы открыть\"\n\t\tset slot {_menuSlot} of {_menu} to {_displayIcon}\n\t\tset {country.storage5-menu-category::%uuid of {_p}%::%{_menuSlot}%} to {_cat}'; assert old in s; s=s.replace(old,new,1); old='\tif {_category} is not \"general\":\n\t\tif countryStorageCanManageCategories({_p}) is true:\n\t\t\tset slot 47 of {_menu} to name tag named \"<yellow><bold>ПЕРЕИМЕНОВАТЬ\"\n\t\t\tif countryStorageCategorySlots({_id}, {_category}) is 0:\n\t\t\t\tset slot 48 of {_menu} to barrier named \"<red><bold>УДАЛИТЬ КАТЕГОРИЮ\"'; new='\tif {_category} is not \"general\":\n\t\tif countryStorageCanManageCategories({_p}) is true:\n\t\t\tset slot 47 of {_menu} to name tag named \"<yellow><bold>ПЕРЕИМЕНОВАТЬ\"\n\t\t\tif countryStorageCategorySlots({_id}, {_category}) is 0:\n\t\t\t\tset slot 48 of {_menu} to barrier named \"<red><bold>УДАЛИТЬ КАТЕГОРИЮ\"\n\t\t\tset {_savedIcon} to {country.storage-category-icon::%{_id}%::%{_category}%}\n\t\t\tif {_savedIcon} is set:\n\t\t\t\tset {_iconButton} to {_savedIcon}\n\t\t\telse:\n\t\t\t\tset {_iconButton} to item frame\n\t\t\tset amount of {_iconButton} to 1\n\t\t\tset name of {_iconButton} to \"<aqua><bold>ИКОНКА КАТЕГОРИИ\"\n\t\t\tset lore of {_iconButton} to \"<gray>Возьмите предмет в основную руку\" and \"<gray>и нажмите сюда, чтобы сделать\" and \"<gray>его иконкой категории.\" and \"\" and \"<yellow>Пустая рука — сбросить иконку\"\n\t\t\tset slot 50 of {_menu} to {_iconButton}'; assert old in s; s=s.replace(old,new,1); old='\t\tif {_raw} is 48:\n\t\t\tif {_cat} is not \"general\":\n\t\t\t\tif countryStorageCanManageCategories(player) is true:\n\t\t\t\t\tif countryStorageCategorySlots({_id}, {_cat}) is 0:\n\t\t\t\t\t\tdelete {country.storage-category-name::%{_id}%::%{_cat}%}\n\t\t\t\t\t\tdelete {country.storage5::%{_id}%::%{_cat}%::*}\n\t\t\t\t\t\tcountryOpenStorageHub(player)\n\t\t\tstop\n\t\tif {_raw} is 51:'; new='\t\tif {_raw} is 48:\n\t\t\tif {_cat} is not \"general\":\n\t\t\t\tif countryStorageCanManageCategories(player) is true:\n\t\t\t\t\tif countryStorageCategorySlots({_id}, {_cat}) is 0:\n\t\t\t\t\t\tdelete {country.storage-category-name::%{_id}%::%{_cat}%}\n\t\t\t\t\t\tdelete {country.storage-category-icon::%{_id}%::%{_cat}%}\n\t\t\t\t\t\tdelete {country.storage5::%{_id}%::%{_cat}%::*}\n\t\t\t\t\t\tcountryOpenStorageHub(player)\n\t\t\tstop\n\t\tif {_raw} is 50:\n\t\t\tif {_cat} is not \"general\":\n\t\t\t\tif countryStorageCanManageCategories(player) is true:\n\t\t\t\t\tset {_held} to player\'s tool\n\t\t\t\t\tif {_held} is set:\n\t\t\t\t\t\tif {_held} is not air:\n\t\t\t\t\t\t\tset {_icon} to {_held}\n\t\t\t\t\t\t\tset amount of {_icon} to 1\n\t\t\t\t\t\t\tset {country.storage-category-icon::%{_id}%::%{_cat}%} to {_icon}\n\t\t\t\t\t\t\tsend \"<green>Иконка категории изменена.\" to player\n\t\t\t\t\t\t\tcountryOpenStorageCategory(player, {_cat}, {_page})\n\t\t\t\t\t\t\tstop\n\t\t\t\t\tdelete {country.storage-category-icon::%{_id}%::%{_cat}%}\n\t\t\t\t\tsend \"<yellow>Иконка категории сброшена.\" to player\n\t\t\t\t\tcountryOpenStorageCategory(player, {_cat}, {_page})\n\t\t\tstop\n\t\tif {_raw} is 51:'; assert old in s; s=s.replace(old,new,1); s=s.replace('\"<gray>Остальное попадёт в Общее.\"','\"<gray>Остальные предметы останутся у вас.\"',1); p.write_text(s,encoding='utf-8')"
      - name: Commit changes
        shell: bash
        run: |
          git rm .github/workflows/add-storage-category-icons.yml
          git config user.name "Politaria Bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/plugins/Skript/scripts/countries_storage.sk
          git commit -m "Add custom icons for storage categories"
          git pull --rebase origin main
          git push origin main