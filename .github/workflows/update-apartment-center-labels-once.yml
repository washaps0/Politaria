name: Update apartment center labels once

on:
  push:
    paths:
      - '.github/workflows/update-apartment-center-labels-once.yml'
      - '.github/scripts/add_apartment_center_labels.py'

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Patch apartment plugin source
        run: python .github/scripts/add_apartment_center_labels.py

      - name: Build PolitariaApartments
        working-directory: server/pluginsource/PolitariaApartments
        run: gradle clean jar --no-daemon

      - name: Update server plugin jar
        run: cp server/pluginsource/PolitariaApartments/build/libs/PolitariaApartments.jar server/plugins/PolitariaApartments.jar

      - name: Commit source and jar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/pluginsource/PolitariaApartments/src/main/java/ru/politaria/apartments/ApartmentPlugin.java
          git add server/pluginsource/PolitariaApartments/build.gradle
          git add server/plugins/PolitariaApartments.jar
          git commit -m "Add floating apartment center labels"
          git push
