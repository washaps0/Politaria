name: Fix player skin heads once

on:
  push:
    paths:
      - '.github/workflows/fix-player-skin-heads-once.yml'
      - '.github/scripts/fix_player_skin_heads.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch skin heads
        run: python .github/scripts/fix_player_skin_heads.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/plugins/Skript/scripts/countries.sk
          git add server/plugins/Skript/scripts/wanted.sk
          git commit -m "Fix player skins in country and wanted lists"
          git push
