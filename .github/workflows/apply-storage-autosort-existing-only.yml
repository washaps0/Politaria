name: Apply storage autosort existing only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-storage-autosort-existing-only.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch autosort
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit fix
        run: |
          git rm .github/workflows/apply-storage-autosort-existing-only.yml
          git rm -f .github/workflows/fix-storage-autosort-existing-only.yml || true
          git config user.name "Politaria Bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/plugins/Skript/scripts/countries_storage.sk
          git commit -m "Sort only existing storage item types"
          git pull --rebase origin main
          git push origin main
