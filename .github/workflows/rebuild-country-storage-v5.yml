\t\tstop
\tif {_cat} is not set:
\t\tcancel event
\t\tstop
\twait 1 tick
\tcountryStorageSyncInventory(player, {_id}, {_cat}, {_page}, {_openInventory})

on quit:
\tdelete {country.storage5-menu-category::%uuid of player%::*}
\tdelete {country.storage5-current-category::%uuid of player%}
\tdelete {country.storage5-current-page::%uuid of player%}
\tdelete {country.storage5-input::%uuid of player%}
\tdelete {country.storage5-rename-category::%uuid of player%}
