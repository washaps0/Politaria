name: Fix country storage native movement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-country-storage-native.yml'

permissions:
  contents: write

jobs:
  fix-storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch countries_storage.sk
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_storage.py
          python /tmp/patch_storage.py
      - name: Commit fix and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-country-storage-native.yml
          git config user.name "Politaria Bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/plugins/Skript/scripts/countries_storage.sk
          git commit -m "Fix normal item movement in country storage"
          git push origin main
