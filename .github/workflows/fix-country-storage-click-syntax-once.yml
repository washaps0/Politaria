name: Fix country storage click syntax once

on:
  push:
    paths:
      - '.github/workflows/fix-country-storage-click-syntax-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix Skript right click syntax
        shell: python
        run: |
          from pathlib import Path

          p = Path('server/plugins/Skript/scripts/countries_storage.sk')
          s = p.read_text(encoding='utf-8')

          old = 'if click type is right mouse button or click type is right mouse button with shift:'
          new = '''set {_right-click} to false
\t\t\tif click type is right mouse button:
\t\t\t\tset {_right-click} to true
\t\t\tif click type is right mouse button with shift:
\t\t\t\tset {_right-click} to true
\t\t\tif {_right-click} is true:'''

          count = s.count(old)
          if count != 2:
              raise SystemExit(f'Expected 2 broken click conditions, found {count}')

          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/plugins/Skript/scripts/countries_storage.sk
          git commit -m "Fix Skript storage right-click syntax"
          git push
