name: Fix country storage click syntax once

on:
  push:
    paths:
      - '.github/workflows/fix-country-storage-click-syntax-once.yml'
      - '.github/scripts/fix_country_storage_click_syntax.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply click syntax patch
        run: python .github/scripts/fix_country_storage_click_syntax.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/plugins/Skript/scripts/countries_storage.sk
          git commit -m "Fix Skript storage right-click syntax"
          git push
