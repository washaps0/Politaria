name: Remove duplicate storage wrapper
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-duplicate-storage-wrapper.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove duplicate wrapper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server/plugins/Skript/scripts/countries_storage.sk')
          s = p.read_text(encoding='utf-8')
          block = '''# Compatibility for older callers.\nfunction countryOpenStorage2(p: player, page: number):\n\tcountryOpenStorageCategory({_p}, "general", {_page})\n\n'''
          if s.count('function countryOpenStorage2(p: player, page: number):') != 2:
              raise SystemExit('Expected exactly 2 countryOpenStorage2 definitions')
          if block not in s:
              raise SystemExit('V5 compatibility wrapper block not found')
          s = s.replace(block, '', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git rm .github/workflows/remove-duplicate-storage-wrapper.yml
          git config user.name "Politaria Bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/plugins/Skript/scripts/countries_storage.sk
          git commit -m "Remove duplicate countryOpenStorage2 function"
          git pull --rebase origin main
          git push origin main
