name: Fix generated storage indentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-storage-tabs.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Replace escaped tabs and fix category id construction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server/plugins/Skript/scripts/countries_storage.sk')
          t=p.read_text(encoding='utf-8')
          t=t.replace('\\t','\t')
          old='\t\tset {_cat} to "c%{country.storage-category-seq::%{_id}%}%"'
          new='\t\tset {_seq} to {country.storage-category-seq::%{_id}%}\n\t\tset {_cat} to "c%{_seq}%"'
          t=t.replace(old,new)
          p.write_text(t,encoding='utf-8')
          PY
      - name: Commit safely
        shell: bash
        run: |
          git rm .github/workflows/fix-storage-tabs.yml
          git config user.name "Politaria Bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/plugins/Skript/scripts/countries_storage.sk
          git commit -m "Fix clean storage Skript indentation"
          git pull --rebase origin main
          git push origin main
