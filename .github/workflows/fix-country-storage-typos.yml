name: Fix storage sync typos
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-country-storage-typos.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - shell: bash
        run: |
          echo '' | base64 -d > /tmp/fix.py
          python /tmp/fix.py
      - shell: bash
        run: |
          git rm .github/workflows/fix-country-storage-typos.yml
          git config user.name "Politaria Bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/plugins/Skript/scripts/countries_storage.sk
          git commit -m "Fix country storage native sync syntax"
          git push origin main
