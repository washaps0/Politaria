name: Apply country storage V3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-country-storage-v3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace category storage section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          target = Path('server/plugins/Skript/scripts/countries_storage.sk')
          section_file = Path('.github/storage-v3-section.txt')
          text = target.read_text(encoding='utf-8')
          marker = '# =========================================================\n# COUNTRY STORAGE CATEGORIES V2\n'
          if marker not in text:
              marker = '# =========================================================\n# COUNTRY STORAGE CATEGORIES V3\n'
          if marker not in text:
              raise SystemExit('storage categories marker not found')
          prefix = text.split(marker, 1)[0].rstrip() + '\n\n'
          section = section_file.read_text(encoding='utf-8').rstrip() + '\n'
          target.write_text(prefix + section, encoding='utf-8')
          PY

      - name: Commit V3 and remove temporary files
        shell: bash
        run: |
          git rm .github/workflows/apply-country-storage-v3.yml .github/storage-v3-section.txt
          git config user.name "Politaria Bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/plugins/Skript/scripts/countries_storage.sk
          git commit -m "Make country storage keep real chest slot positions"
          git push origin main
