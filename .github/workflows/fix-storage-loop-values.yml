name: Fix country storage nested loops

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-storage-loop-values.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch storage loops
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/fix_storage.py
          python /tmp/fix_storage.py

      - name: Commit fix
        shell: bash
        run: |
          git rm .github/workflows/fix-storage-loop-values.yml
          git config user.name "Politaria Bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/plugins/Skript/scripts/countries_storage.sk
          git commit -m "Fix ambiguous country storage loop values"
          git pull --rebase origin main
          git push origin main