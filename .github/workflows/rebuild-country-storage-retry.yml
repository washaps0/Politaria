name: Retry clean country storage rebuild

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-country-storage-retry.yml'

permissions:
  contents: write

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run verified rebuild block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          w = Path('.github/workflows/rebuild-country-storage-clean.yml').read_text(encoding='utf-8')
          start = w.index('      - name: Rebuild storage code')
          run_marker = '        run: |\n'
          body_start = w.index(run_marker, start) + len(run_marker)
          body_end = w.index('\n      - name: Commit rebuilt storage', body_start)
          lines = w[body_start:body_end].splitlines()
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/rebuild-storage.sh').write_text(body, encoding='utf-8')
          PY
          bash /tmp/rebuild-storage.sh

      - name: Commit and rebase safely
        shell: bash
        run: |
          git rm .github/workflows/rebuild-country-storage-clean.yml
          git rm .github/workflows/rebuild-country-storage-retry.yml
          git config user.name "Politaria Bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/plugins/Skript/scripts/countries_storage.sk
          git commit -m "Rebuild country storage from scratch"
          git pull --rebase origin main
          git push origin main
