name: Build PolitariaLocator

on:
  push:
    branches: [ main ]
    paths:
      - 'plugins-src/PolitariaLocator/**'
      - '.github/workflows/build-politaria-locator.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0.0'

      - name: Build plugin
        run: gradle -p plugins-src/PolitariaLocator build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PolitariaLocator
          path: plugins-src/PolitariaLocator/build/libs/*.jar
          if-no-files-found: error

      - name: Install JAR into server/plugins
        run: cp plugins-src/PolitariaLocator/build/libs/PolitariaLocator-1.0.0.jar server/plugins/PolitariaLocator.jar

      - name: Commit built plugin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/plugins/PolitariaLocator.jar
          if git diff --cached --quiet; then
            echo "PolitariaLocator.jar is already current."
            exit 0
          fi
          git commit -m "Build PolitariaLocator plugin"
          git push
