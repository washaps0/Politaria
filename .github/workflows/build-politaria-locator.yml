name: Build PolitariaLocator

on:
  push:
    branches: [ main ]
    paths:
      - 'plugins-src/PolitariaLocator/**'
      - '.github/workflows/build-politaria-locator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build plugin
        run: gradle -p plugins-src/PolitariaLocator build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PolitariaLocator
          path: plugins-src/PolitariaLocator/build/libs/*.jar
          if-no-files-found: error
