name: Add apartment teleport delay once

on:
  push:
    paths:
      - '.github/workflows/add-apartment-teleport-delay-once.yml'
      - '.github/scripts/add_apartment_teleport_delay.py'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Patch apartment teleport
        run: python .github/scripts/add_apartment_teleport_delay.py

      - name: Build PolitariaApartments
        run: gradle -p server/pluginsource/PolitariaApartments clean build --no-daemon

      - name: Copy built plugin
        run: cp server/pluginsource/PolitariaApartments/build/libs/PolitariaApartments.jar server/plugins/PolitariaApartments.jar

      - name: Commit source and jars
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/pluginsource/PolitariaApartments/src/main/java/ru/politaria/apartments/ApartmentPlugin.java
          git add server/pluginsource/PolitariaApartments/build/libs/PolitariaApartments.jar
          git add server/plugins/PolitariaApartments.jar
          git commit -m "Add apartment teleport delay and damage cancel"
          git push
