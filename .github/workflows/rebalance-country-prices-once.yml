name: Rebalance country prices once

on:
  push:
    paths:
      - '.github/workflows/rebalance-country-prices-once.yml'

permissions:
  contents: write

jobs:
  rebalance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reduce country progression prices
        shell: python
        run: |
          from pathlib import Path

          p = Path('server/plugins/Skript/scripts/countries_storage.sk')
          s = p.read_text(encoding='utf-8')

          replacements = {
              # Country level display prices
              '6000 монет • 128 железа • 48 золота • 16 алмазов • 256 камня': '3500 монет • 96 железа • 24 золота • 8 алмазов • 160 камня',
              '18000 монет • 256 железа • 128 золота • 40 алмазов • 32 изумруда': '9000 монет • 160 железа • 64 золота • 20 алмазов • 16 изумрудов',

              # Building display prices
              '2000 монет • 64 железа • 16 золота': '1200 монет • 48 железа • 8 золота',
              '5000 монет • 128 железа • 32 золота • 8 алмазов': '3000 монет • 96 железа • 20 золота • 4 алмаза',
              '10000 монет • 192 железа • 64 золота • 20 алмазов': '6000 монет • 128 железа • 40 золота • 10 алмазов',
              '1000 монет • 128 пшеницы • 64 дуба': '700 монет • 96 пшеницы • 48 дуба',
              '2500 монет • 256 пшеницы • 96 дуба • 32 железа': '1600 монет • 160 пшеницы • 64 дуба • 20 железа',
              '5000 монет • 384 пшеницы • 128 дуба • 64 железа • 8 алмазов': '3200 монет • 256 пшеницы • 96 дуба • 40 железа • 4 алмаза',
              '1500 монет • 128 дуба • 32 железа': '1000 монет • 96 дуба • 20 железа',
              '3500 монет • 192 дуба • 64 железа • 16 золота': '2200 монет • 128 дуба • 40 железа • 8 золота',
              '7000 монет • 256 дуба • 96 железа • 8 алмазов': '4500 монет • 192 дуба • 64 железа • 4 алмаза',
              '1800 монет • 256 камня • 32 железа': '1200 монет • 160 камня • 20 железа',
              '4000 монет • 384 камня • 64 железа • 16 золота': '2500 монет • 256 камня • 40 железа • 8 золота',
              '8000 монет • 512 камня • 128 железа • 8 алмазов': '5000 монет • 384 камня • 80 железа • 4 алмаза',
              '2000 монет • 64 сена • 64 дуба': '1200 монет • 40 сена • 48 дуба',
              '4500 монет • 128 сена • 96 дуба • 32 железа': '2800 монет • 80 сена • 64 дуба • 20 железа',
              '8500 монет • 192 сена • 128 дуба • 64 железа • 16 золота': '5500 монет • 128 сена • 96 дуба • 40 железа • 8 золота',
          }

          for old, new in replacements.items():
              s = s.replace(old, new)

          # Runtime costs: exact blocks from countryTryUpgradeLevel2
          s = s.replace('''\tif {_next} is 2:\n\t\tset {_money} to 6000\n\t\tset {_m1} to "iron ingot"\n\t\tset {_a1} to 128\n\t\tset {_m2} to "gold ingot"\n\t\tset {_a2} to 48\n\t\tset {_m3} to "diamond"\n\t\tset {_a3} to 16\n\t\tset {_m4} to "stone"\n\t\tset {_a4} to 256\n\telse:\n\t\tset {_money} to 18000\n\t\tset {_m1} to "iron ingot"\n\t\tset {_a1} to 256\n\t\tset {_m2} to "gold ingot"\n\t\tset {_a2} to 128\n\t\tset {_m3} to "diamond"\n\t\tset {_a3} to 40\n\t\tset {_m4} to "emerald"\n\t\tset {_a4} to 32''', '''\tif {_next} is 2:\n\t\tset {_money} to 3500\n\t\tset {_m1} to "iron ingot"\n\t\tset {_a1} to 96\n\t\tset {_m2} to "gold ingot"\n\t\tset {_a2} to 24\n\t\tset {_m3} to "diamond"\n\t\tset {_a3} to 8\n\t\tset {_m4} to "stone"\n\t\tset {_a4} to 160\n\telse:\n\t\tset {_money} to 9000\n\t\tset {_m1} to "iron ingot"\n\t\tset {_a1} to 160\n\t\tset {_m2} to "gold ingot"\n\t\tset {_a2} to 64\n\t\tset {_m3} to "diamond"\n\t\tset {_a3} to 20\n\t\tset {_m4} to "emerald"\n\t\tset {_a4} to 16''')

          # Building runtime values. These replacements are scoped by the exact value sequences.
          runtime = [
              ('set {_money} to 2000\n\t\t\tset {_m1} to "iron ingot"\n\t\t\tset {_a1} to 64\n\t\t\tset {_m2} to "gold ingot"\n\t\t\tset {_a2} to 16', 'set {_money} to 1200\n\t\t\tset {_m1} to "iron ingot"\n\t\t\tset {_a1} to 48\n\t\t\tset {_m2} to "gold ingot"\n\t\t\tset {_a2} to 8'),
              ('set {_money} to 5000\n\t\t\tset {_m1} to "iron ingot"\n\t\t\tset {_a1} to 128\n\t\t\tset {_m2} to "gold ingot"\n\t\t\tset {_a2} to 32\n\t\t\tset {_m3} to "diamond"\n\t\t\tset {_a3} to 8', 'set {_money} to 3000\n\t\t\tset {_m1} to "iron ingot"\n\t\t\tset {_a1} to 96\n\t\t\tset {_m2} to "gold ingot"\n\t\t\tset {_a2} to 20\n\t\t\tset {_m3} to "diamond"\n\t\t\tset {_a3} to 4'),
              ('set {_money} to 10000\n\t\t\tset {_m1} to "iron ingot"\n\t\t\tset {_a1} to 192\n\t\t\tset {_m2} to "gold ingot"\n\t\t\tset {_a2} to 64\n\t\t\tset {_m3} to "diamond"\n\t\t\tset {_a3} to 20', 'set {_money} to 6000\n\t\t\tset {_m1} to "iron ingot"\n\t\t\tset {_a1} to 128\n\t\t\tset {_m2} to "gold ingot"\n\t\t\tset {_a2} to 40\n\t\t\tset {_m3} to "diamond"\n\t\t\tset {_a3} to 10'),
              ('set {_money} to 1000\n\t\t\tset {_m1} to "wheat"\n\t\t\tset {_a1} to 128\n\t\t\tset {_m2} to "oak log"\n\t\t\tset {_a2} to 64', 'set {_money} to 700\n\t\t\tset {_m1} to "wheat"\n\t\t\tset {_a1} to 96\n\t\t\tset {_m2} to "oak log"\n\t\t\tset {_a2} to 48'),
              ('set {_money} to 2500\n\t\t\tset {_m1} to "wheat"\n\t\t\tset {_a1} to 256\n\t\t\tset {_m2} to "oak log"\n\t\t\tset {_a2} to 96\n\t\t\tset {_m3} to "iron ingot"\n\t\t\tset {_a3} to 32', 'set {_money} to 1600\n\t\t\tset {_m1} to "wheat"\n\t\t\tset {_a1} to 160\n\t\t\tset {_m2} to "oak log"\n\t\t\tset {_a2} to 64\n\t\t\tset {_m3} to "iron ingot"\n\t\t\tset {_a3} to 20'),
              ('set {_money} to 5000\n\t\t\tset {_m1} to "wheat"\n\t\t\tset {_a1} to 384\n\t\t\tset {_m2} to "oak log"\n\t\t\tset {_a2} to 128\n\t\t\tset {_m3} to "iron ingot"\n\t\t\tset {_a3} to 64\n\t\t\tset {_m4} to "diamond"\n\t\t\tset {_a4} to 8', 'set {_money} to 3200\n\t\t\tset {_m1} to "wheat"\n\t\t\tset {_a1} to 256\n\t\t\tset {_m2} to "oak log"\n\t\t\tset {_a2} to 96\n\t\t\tset {_m3} to "iron ingot"\n\t\t\tset {_a3} to 40\n\t\t\tset {_m4} to "diamond"\n\t\t\tset {_a4} to 4'),
              ('set {_money} to 1500\n\t\t\tset {_m1} to "oak log"\n\t\t\tset {_a1} to 128\n\t\t\tset {_m2} to "iron ingot"\n\t\t\tset {_a2} to 32', 'set {_money} to 1000\n\t\t\tset {_m1} to "oak log"\n\t\t\tset {_a1} to 96\n\t\t\tset {_m2} to "iron ingot"\n\t\t\tset {_a2} to 20'),
              ('set {_money} to 3500\n\t\t\tset {_m1} to "oak log"\n\t\t\tset {_a1} to 192\n\t\t\tset {_m2} to "iron ingot"\n\t\t\tset {_a2} to 64\n\t\t\tset {_m3} to "gold ingot"\n\t\t\tset {_a3} to 16', 'set {_money} to 2200\n\t\t\tset {_m1} to "oak log"\n\t\t\tset {_a1} to 128\n\t\t\tset {_m2} to "iron ingot"\n\t\t\tset {_a2} to 40\n\t\t\tset {_m3} to "gold ingot"\n\t\t\tset {_a3} to 8'),
              ('set {_money} to 7000\n\t\t\tset {_m1} to "oak log"\n\t\t\tset {_a1} to 256\n\t\t\tset {_m2} to "iron ingot"\n\t\t\tset {_a2} to 96\n\t\t\tset {_m3} to "diamond"\n\t\t\tset {_a3} to 8', 'set {_money} to 4500\n\t\t\tset {_m1} to "oak log"\n\t\t\tset {_a1} to 192\n\t\t\tset {_m2} to "iron ingot"\n\t\t\tset {_a2} to 64\n\t\t\tset {_m3} to "diamond"\n\t\t\tset {_a3} to 4'),
              ('set {_money} to 1800\n\t\t\tset {_m1} to "stone"\n\t\t\tset {_a1} to 256\n\t\t\tset {_m2} to "iron ingot"\n\t\t\tset {_a2} to 32', 'set {_money} to 1200\n\t\t\tset {_m1} to "stone"\n\t\t\tset {_a1} to 160\n\t\t\tset {_m2} to "iron ingot"\n\t\t\tset {_a2} to 20'),
              ('set {_money} to 4000\n\t\t\tset {_m1} to "stone"\n\t\t\tset {_a1} to 384\n\t\t\tset {_m2} to "iron ingot"\n\t\t\tset {_a2} to 64\n\t\t\tset {_m3} to "gold ingot"\n\t\t\tset {_a3} to 16', 'set {_money} to 2500\n\t\t\tset {_m1} to "stone"\n\t\t\tset {_a1} to 256\n\t\t\tset {_m2} to "iron ingot"\n\t\t\tset {_a2} to 40\n\t\t\tset {_m3} to "gold ingot"\n\t\t\tset {_a3} to 8'),
              ('set {_money} to 8000\n\t\t\tset {_m1} to "stone"\n\t\t\tset {_a1} to 512\n\t\t\tset {_m2} to "iron ingot"\n\t\t\tset {_a2} to 128\n\t\t\tset {_m3} to "diamond"\n\t\t\tset {_a3} to 8', 'set {_money} to 5000\n\t\t\tset {_m1} to "stone"\n\t\t\tset {_a1} to 384\n\t\t\tset {_m2} to "iron ingot"\n\t\t\tset {_a2} to 80\n\t\t\tset {_m3} to "diamond"\n\t\t\tset {_a3} to 4'),
              ('set {_money} to 2000\n\t\t\tset {_m1} to "hay bale"\n\t\t\tset {_a1} to 64\n\t\t\tset {_m2} to "oak log"\n\t\t\tset {_a2} to 64', 'set {_money} to 1200\n\t\t\tset {_m1} to "hay bale"\n\t\t\tset {_a1} to 40\n\t\t\tset {_m2} to "oak log"\n\t\t\tset {_a2} to 48'),
              ('set {_money} to 4500\n\t\t\tset {_m1} to "hay bale"\n\t\t\tset {_a1} to 128\n\t\t\tset {_m2} to "oak log"\n\t\t\tset {_a2} to 96\n\t\t\tset {_m3} to "iron ingot"\n\t\t\tset {_a3} to 32', 'set {_money} to 2800\n\t\t\tset {_m1} to "hay bale"\n\t\t\tset {_a1} to 80\n\t\t\tset {_m2} to "oak log"\n\t\t\tset {_a2} to 64\n\t\t\tset {_m3} to "iron ingot"\n\t\t\tset {_a3} to 20'),
              ('set {_money} to 8500\n\t\t\tset {_m1} to "hay bale"\n\t\t\tset {_a1} to 192\n\t\t\tset {_m2} to "oak log"\n\t\t\tset {_a2} to 128\n\t\t\tset {_m3} to "iron ingot"\n\t\t\tset {_a3} to 64\n\t\t\tset {_m4} to "gold ingot"\n\t\t\tset {_a4} to 16', 'set {_money} to 5500\n\t\t\tset {_m1} to "hay bale"\n\t\t\tset {_a1} to 128\n\t\t\tset {_m2} to "oak log"\n\t\t\tset {_a2} to 96\n\t\t\tset {_m3} to "iron ingot"\n\t\t\tset {_a3} to 40\n\t\t\tset {_m4} to "gold ingot"\n\t\t\tset {_a4} to 8'),
          ]
          for old, new in runtime:
              s = s.replace(old, new)

          p.write_text(s, encoding='utf-8')

      - name: Commit rebalance
        run: |
          git config user.name "Politaria Bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/plugins/Skript/scripts/countries_storage.sk
          if git diff --cached --quiet; then
            echo "No price changes were needed"
            exit 0
          fi
          git commit -m "Rebalance country progression prices"
          git push
