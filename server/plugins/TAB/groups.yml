# TAB group formatting for Politaria.
# PolitariaIdentity provides the dynamic %politaria_tags% placeholder.

Player:
  tabprefix: "&0&l[&7&lPlayer&0&l] &3"
  tagprefix: "&2&lPlayer &3"

# Defaults for players that do not match a specific TAB group.
# LuckPerms is not installed on this server, so do not reference its placeholders here.
_DEFAULT_:
  tabprefix: ""
  tagprefix: ""
  customtabname: "%politaria_tags%%player%"
  tabsuffix: ""
  tagsuffix: ""
