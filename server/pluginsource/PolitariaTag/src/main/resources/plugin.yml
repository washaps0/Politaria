name: PolitariaTags
version: 1.0.0
main: ru.politaria.tags.PolitariaTagsPlugin
api-version: '1.21'
authors: [Politaria]
description: Multiple player tags for Politaria.
softdepend: [PolitariaIdentity]

commands:
  tag:
    description: Manage player tags.
    usage: /tag <add|remove|list> <player> [tag]
    permission: politaria.tags.manage

permissions:
  politaria.tags.manage:
    default: op
