header-footer:
  enabled: true
  header:
    - "<#69B7FF>&m                                                </#9D7BFF>"
    - "<#69B7FF>&lPOLITARIA"
    - "&7Политический Minecraft-сервер"
    - ""
    - "&7Игрок: &f%player% &8• &7Онлайн: &f%online%&8/&f%politaria_maxplayers%"
  footer:
    - ""
    - "&7Пинг: &f%ping%ms &8• &7Время МСК: &f%politaria_time%"
    - "&7Игровой адрес: &fpolitaria.xubi.org"
    - "<#69B7FF>&m                                                </#9D7BFF>"
  disable-condition: '%world%=disabledworld'

tablist-name-formatting:
  enabled: true
  anti-override: true
  disable-condition: '%world%=disabledworld'

# PolitariaIdentity already manages per-viewer nametags.
scoreboard-teams:
  enabled: false
  enable-collision: true
  invisible-nametags: false
  anti-override: false
  sorting-types:
    - "PLACEHOLDER_A_TO_Z:%player%"
  case-sensitive-sorting: false
  can-see-friendly-invisibles: false
  disable-condition: '%world%=disabledworld'

playerlist-objective:
  enabled: true
  value: "%ping%"
  fancy-value: "&7%ping%ms"
  title: "POLITARIA"
  render-type: INTEGER
  disable-condition: '%world%=disabledworld'

belowname-objective:
  enabled: false
  value: "%health%"
  title: "&c❤"
  fancy-value: "&c%health% ❤"
  fancy-value-default: "NPC"
  disable-condition: '%world%=disabledworld'

prevent-spectator-effect:
  enabled: false

bossbar:
  enabled: false
  toggle-command: /bossbar
  remember-toggle-choice: false
  hidden-by-default: false
  bars: {}

scoreboard:
  enabled: true
  toggle-command: /sb
  remember-toggle-choice: true
  hidden-by-default: false
  use-numbers: false
  static-number: 0
  delay-on-join-milliseconds: 1000
  scoreboards:
    politaria:
      title: "<#69B7FF>&lPOLITARIA"
      lines:
        - "&8%politaria_date%"
        - ""
        - "<#9D7BFF>&lИГРОК"
        - "&7Ник: &f%player%"
        - "&7Баланс: &6%politaria_balance% монет"
        - "&7Страна: &f%politaria_country%"
        - "&7Роль: &f%politaria_role%"
        - "&7Участников: &f%politaria_members%"
        - ""
        - "<#69B7FF>&lСЕРВЕР"
        - "&7Онлайн: &f%online%&8/&f%politaria_maxplayers%"
        - "&7Пинг: &f%ping%ms"
        - ""
        - "&bpolitaria.xubi.org"

layout:
  enabled: false
  direction: COLUMNS
  default-skin: mineskin:383747683
  enable-remaining-players-text: true
  remaining-players-text: '... и ещё %s'
  empty-slot-ping-value: 1000
  layouts: {}

ping-spoof:
  enabled: false
  value: 0

placeholders:
  date-format: "dd.MM.yyyy"
  time-format: "HH:mm"
  time-offset: 0
  register-tab-expansion: false

placeholder-output-replacements: {}
conditions: {}

placeholder-refresh-intervals:
  default-refresh-interval: 500
  "%ping%": 1000
  "%politaria_balance%": 1000
  "%politaria_country%": 1000
  "%politaria_role%": 1000
  "%politaria_members%": 1000
  "%politaria_maxplayers%": 5000
  "%politaria_time%": 1000
  "%politaria_date%": 60000

assign-groups-by-permissions: false
primary-group-finding-list:
  - Owner
  - Admin
  - Moderator
  - default
permission-refresh-interval: 1000
debug: false

mysql:
  enabled: false
  host: 127.0.0.1
  port: 3306
  database: tab
  username: user
  password: password
  useSSL: true

proxy-support:
  enabled: false
  type: PLUGIN
  plugin:
    name: RedisBungee
  redis:
    url: 'redis://:password@localhost:6379/0'
  rabbitmq:
    exchange: tab
    url: 'amqp://guest:guest@localhost:5672/%2F'

per-world-playerlist:
  enabled: false
  allow-bypass-permission: false
  ignore-effect-in-worlds: []
  shared-playerlist-world-groups: {}

compensate-for-packetevents-bug: false
global-playerlist:
  enabled: false
  display-others-as-spectators: false
  display-vanished-players-as-spectators: true
  isolate-unlisted-servers: false
  update-latency: false
  spy-servers: []
  server-groups: {}
use-bukkit-permissions-manager: false
use-online-uuid-in-tablist: true
